<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agentcrew — Forensics (mockup)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --border: #dfe3e9; --border-soft: #eaedf1;
    --text: #1a212c; --muted: #626b7a; --accent: #0f8f86; --accent-weak: #e3f4f2;
    --working: #3b82f6; --waiting: #d97706; --rate: #7c3aed; --stuck: #ea580c; --crashed: #dc2626; --done: #059669;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #171b21; --border: #262c35; --border-soft: #1e232b;
      --text: #e7e9ed; --muted: #8b93a2; --accent: #3fd6cc; --accent-weak: #12302d;
      --working: #5b9bff; --waiting: #f2a93c; --rate: #a78bfa; --stuck: #fb923c; --crashed: #f87171; --done: #34d399;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --panel: #171b21; --border: #262c35; --border-soft: #1e232b;
    --text: #e7e9ed; --muted: #8b93a2; --accent: #3fd6cc; --accent-weak: #12302d;
    --working: #5b9bff; --waiting: #f2a93c; --rate: #a78bfa; --stuck: #fb923c; --crashed: #f87171; --done: #34d399;
  }
  * { box-sizing: border-box; }
  html, body { color-scheme: light dark; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mockflag { background: var(--accent-weak); color: var(--accent); border-bottom: 1px solid var(--border); padding: 6px 20px; font: 500 11.5px/1.4 var(--sans); }
  header.top { background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 9px; font: 700 15px/1 var(--sans); letter-spacing: -.01em; }
  .brand .mark { width: 20px; height: 20px; border-radius: 5px; background: var(--accent); display: grid; place-items: center; color: var(--panel); font: 700 11px var(--sans); }
  nav.pages { display: flex; gap: 4px; }
  nav.pages a { color: var(--muted); text-decoration: none; font: 600 12.5px var(--sans); padding: 6px 10px; border-radius: 6px; }
  nav.pages a:hover { background: var(--border-soft); color: var(--text); }
  nav.pages a.current { background: var(--accent-weak); color: var(--accent); }
  select { font: 400 13px var(--sans); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  main { max-width: 1040px; margin: 22px auto 60px; padding: 0 20px; display: grid; gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  h2 { font: 600 12px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--border-soft); font-size: 13px; vertical-align: top; }
  th { color: var(--muted); font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .03em; }
  code, pre { font-family: var(--mono); font-size: 12px; }
  pre { background: var(--border-soft); border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow-x: auto; white-space: pre-wrap; margin: 0; }
  .chain { display: grid; gap: 4px; }
  .hop { display: grid; grid-template-columns: 60px 190px 1fr; gap: 10px; align-items: baseline; padding: 7px 9px; border-radius: 6px; }
  .hop.target { background: var(--accent-weak); border: 1px solid var(--accent); }
  .hop .seq { color: var(--muted); font-family: var(--mono); }
  .hop .type { font: 600 13px var(--sans); }
  .hop .actor { color: var(--muted); font-size: 11.5px; }
  .arrow { text-align: center; color: var(--muted); font-size: 10.5px; font-family: var(--mono); }
  time { border-bottom: 1px dotted var(--muted); cursor: help; text-decoration: none; }
  .running { color: var(--working); font-weight: 600; }
  .humanized { font: 500 13px var(--sans); }
  .humanized.running { color: var(--working); font-weight: 600; }
  details { margin-top: 6px; }
  details summary { cursor: pointer; font: 600 11px var(--sans); color: var(--muted); }
  details summary:hover { color: var(--text); }
  details pre { margin-top: 6px; }
</style>
</head>
<body>
<div class="mockflag">MOCKUP — sample data only, per PRODUCT.md §11.3.</div>
<header class="top">
  <div class="brand"><span class="mark">A</span>agentcrew</div>
  <nav class="pages">
    <a href="board.html">Board</a>
    <a href="session.html">Session</a>
    <a href="forensics.html" class="current">Forensics</a>
    <a href="gantt.html">Gantt</a>
  </nav>
  <select id="picker"></select>
</header>
<main>
  <section class="panel">
    <h2>Start and end reasons</h2>
    <div id="reasons"></div>
  </section>
  <section class="panel">
    <h2>Processes</h2>
    <table id="processes"></table>
  </section>
  <section class="panel">
    <h2>Cause chain</h2>
    <div style="margin-bottom:10px;">Trace from: <select id="traceFrom"></select></div>
    <div class="chain" id="chain"></div>
  </section>
</main>

<script src="sample-events.js"></script>
<script>
'use strict';

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(iso) {
  const s = Math.floor((Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}
function relTime(iso) {
  return `<time datetime="${iso}" title="${iso}">${timeAgo(iso)}</time>`;
}

const params = new URLSearchParams(location.search);
const { tasks, sessions, events: allEvents } = SAMPLE_EVENTS;
const DEFAULT_SESSION = sessions[0].id;
const sessionId = sessions.some(s => s.id === params.get('session')) ? params.get('session') : DEFAULT_SESSION;
const session = sessions.find(s => s.id === sessionId);
const events = allEvents.filter(e => e.session_id === sessionId).sort((a, b) => a.seq - b.seq);
const byId = new Map(events.map(e => [e.id, e]));

document.getElementById('picker').innerHTML = sessions.map(s =>
  `<option value="${s.id}" ${s.id === sessionId ? 'selected' : ''}>${escapeHtml(tasks[s.task_id])} — ${s.health}</option>`
).join('');
document.getElementById('picker').addEventListener('change', e => {
  location.href = 'forensics.html?session=' + encodeURIComponent(e.target.value);
});

// §5.3's reason vocabulary is a schema for the store, not for a person
// reading it after a failed overnight run. Read the sentence; the JSON is
// still there, in full, one click away — "in full" per §11.3 never meant
// "only as JSON."
const START_SENTENCE = {
  operator_action: (a) => `Started by ${a}.`,
  schedule: () => 'Started on a schedule.',
  nudge: () => 'Started by an automatic nudge.',
  takeover: (a) => `Started when ${a} took over.`,
  retry: () => 'Started as a retry.',
  hook: () => 'Started by a hook.',
  parent_tool_use: () => 'Started as a subagent call.',
};
const END_SENTENCE = {
  completed: () => 'Finished normally.',
  interrupted_by_operator: () => 'Stopped — you interrupted it.',
  interrupted_by_supervisor: () => 'Stopped — the supervisor interrupted it.',
  timeout_watchdog: () => 'Stopped — the watchdog timed it out.',
  killed_tree: () => "Stopped — its process tree was killed.",
  crashed: () => 'Crashed.',
  quota_exhausted: () => 'Stopped — quota was exhausted.',
  daemon_shutdown: () => 'Stopped — the daemon shut down.',
  orphan_reaped: () => 'Stopped — reaped as an orphan after a daemon restart.',
};
const ACTOR_LABEL = { human: 'you', agent: 'the agent', supervisor: 'the supervisor', watchdog: 'the watchdog', schedule: 'the scheduler' };
function humanizeReason(map, obj) {
  const actor = ACTOR_LABEL[obj.actor] || obj.actor;
  const fn = map[obj.reason];
  return fn ? fn(actor) : `${obj.reason}, by ${actor}`;
}

function renderReasons() {
  const startedCell = `
    <div class="humanized">${escapeHtml(humanizeReason(START_SENTENCE, session.started_by))}</div>
    <details><summary>View raw</summary><pre>${escapeHtml(JSON.stringify(session.started_by, null, 2))}</pre></details>`;
  const endedCell = session.ended_by
    ? `<div class="humanized">${escapeHtml(humanizeReason(END_SENTENCE, session.ended_by))}</div>
       <details><summary>View raw</summary><pre>${escapeHtml(JSON.stringify(session.ended_by, null, 2))}</pre></details>`
    : `<div class="humanized running">Still running — no ended_by yet.</div>`;
  document.getElementById('reasons').innerHTML = `
    <table>
      <tr><th style="width:120px">started_by</th><td>${startedCell}</td></tr>
      <tr><th>ended_by</th><td>${endedCell}</td></tr>
    </table>`;
}

// PRODUCT.md §5.4: never poll ps. This mockup shows exactly what those
// authoritative sources would have already recorded — one row per
// process.spawned, paired with its process.exited if one exists yet.
function renderProcesses() {
  const spawns = events.filter(e => e.type === 'process.spawned');
  const exits = events.filter(e => e.type === 'process.exited');
  const rows = spawns.map((sp, i) => {
    const ex = exits[i]; // one agent process per session in this sample; paired by order
    const lifetime = ex ? `${relTime(sp.ts)} → ${relTime(ex.ts)}` : `${relTime(sp.ts)} → <span class="running">still running</span>`;
    const outcome = ex
      ? `exit ${ex.payload.exit_code ?? '—'}${ex.payload.term_signal ? ', signal ' + ex.payload.term_signal : ''} (${ex.payload.ended_by.reason})`
      : '—';
    return `<tr>
      <td>agent</td>
      <td><code>${sp.payload.pid}</code></td>
      <td><code>${escapeHtml(sp.payload.nonce)}</code></td>
      <td><code>${escapeHtml(sp.payload.argv.join(' '))}</code></td>
      <td>${lifetime}</td>
      <td>${escapeHtml(outcome)}</td>
    </tr>`;
  }).join('');
  document.getElementById('processes').innerHTML = `
    <thead><tr><th>Kind</th><th>PID</th><th>Nonce</th><th>Argv</th><th>Lifetime</th><th>Outcome</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6">No process records for this session.</td></tr>'}</tbody>`;
}

function summarize(e) {
  const p = e.payload || {};
  switch (e.type) {
    case 'session.started': return `${p.adapter} on ${p.runtime}`;
    case 'message.user': return `"${p.text}"`;
    case 'message.assistant': return `"${p.text}"`;
    case 'tool.requested': return `${p.tool_name}: ${p.tool_input.command || p.tool_input.file_path || ''}`;
    case 'tool.completed': return `${p.duration_ms}ms`;
    case 'permission.requested': return `${p.tool_name}: ${p.tool_input.command || p.tool_input.file_path || ''}`;
    case 'permission.decided': return `${p.decision} by ${p.decided_by}`;
    case 'health.changed': return `${p.from} → ${p.to} (tier ${p.tier})`;
    case 'nudge.sent': return `"${p.text}"`;
    case 'process.spawned': return `pid ${p.pid}`;
    case 'process.exited': return `exit ${p.exit_code ?? '—'} (${p.ended_by.reason})`;
    case 'turn.started': return `turn ${p.turn_index}`;
    case 'turn.ended': return `$${p.cost_usd.toFixed(3)} · ${p.tokens.input} in / ${p.tokens.output} out`;
    case 'session.ended': return p.ended_by.reason;
    case 'takeover.requested': case 'takeover.acquired': case 'takeover.released': return '';
    default: return Object.keys(p).length ? JSON.stringify(p) : '';
  }
}

// PRODUCT.md §5.3: "the debugging view is a walk up caused_by. That chain is
// the feature." So walk it literally, root first, target highlighted last.
function renderChain(targetId) {
  const chain = [];
  let cur = byId.get(targetId);
  while (cur) {
    chain.unshift(cur);
    cur = cur.caused_by ? byId.get(cur.caused_by) : null;
  }
  document.getElementById('chain').innerHTML = chain.map((e, i) => `
    ${i > 0 ? '<div class="arrow">↓ caused</div>' : ''}
    <div class="hop ${e.id === targetId ? 'target' : ''}">
      <span class="seq">#${e.seq}</span>
      <span class="type">${e.type}<div class="actor">${e.actor} · ${relTime(e.ts)}</div></span>
      <span>${escapeHtml(summarize(e))}</span>
    </div>`).join('');
}

document.getElementById('traceFrom').innerHTML = events.map(e =>
  `<option value="${e.id}">#${e.seq} ${e.type}</option>`
).join('');
document.getElementById('traceFrom').value = events[events.length - 1].id;
document.getElementById('traceFrom').addEventListener('change', e => renderChain(e.target.value));

document.title = `agentcrew — Forensics: ${tasks[session.task_id]} (mockup)`;
renderReasons();
renderProcesses();
renderChain(events[events.length - 1].id);
</script>
</body>
</html>
